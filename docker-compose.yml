services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritmo_local}
      POSTGRES_DB: ritmo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ritmo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ritmo -d ritmo']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ritmo_data:
